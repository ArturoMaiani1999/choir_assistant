<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Choir Assistant — configurazione in corso</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #10191d; color: #e9e2cf; }
    main { width: min(38rem, calc(100% - 2rem)); padding: 3rem; border: 1px solid #344248; border-radius: 1.5rem; background: #19252a; }
    p:first-child { margin-top: 0; color: #e3c47f; font-size: .8rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: .5rem 0 1rem; font-family: Georgia, serif; font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 500; line-height: 1; }
    p:last-child { margin-bottom: 0; color: #aebbbd; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <p>Choir Assistant</p>
    <h1>Configurazione in corso.</h1>
    <p>Questo indirizzo non contiene ancora spartiti o materiali del repertorio.</p>
  </main>
</body>
</html>
