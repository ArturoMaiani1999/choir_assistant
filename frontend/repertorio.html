<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10191c" />
    <title>Epistrophe · Il mio repertorio</title>
    <link rel="stylesheet" href="repertorio.css" />
    <link rel="stylesheet" href="ambient.css" />
    <script src="session-client.js" defer></script>
    <script src="repertorio.js" defer></script>
  </head>
  <body class="ambient-respiro-page">
    <div class="ambient-respiro" aria-hidden="true">
      <i class="ambient-respiro__glow ambient-respiro__glow--cool"></i>
      <i class="ambient-respiro__glow ambient-respiro__glow--warm"></i>
    </div>
    <header class="page-header">
      <div>
        <span class="eyebrow">EPISTROPHE</span>
        <h1>Il mio repertorio</h1>
        <p>I brani scelti dai direttori e il tuo stato di preparazione.</p>
      </div>
      <nav aria-label="Navigazione principale">
        <a class="back-link" href="index.html">Scelta brani</a>
        <a id="direction-link" href="cockpit.html" hidden>Direzione</a>
      </nav>
    </header>
    <main>
      <section class="welcome" aria-labelledby="welcome-title">
        <div>
          <span class="eyebrow">IL TUO PROGRAMMA</span>
          <h2 id="welcome-title">Ciao, <span id="member-name">corista</span></h2>
          <p id="member-detail">Carico i brani assegnati…</p>
        </div>
        <div id="summary" class="summary" aria-label="Riepilogo dei progressi"></div>
      </section>

      <p id="repertoire-status" class="status" role="status">Caricamento…</p>
      <button id="repertoire-retry" type="button" class="back-link" hidden>Riprova</button>
      <section id="repertoire-content" class="repertoire" hidden aria-labelledby="repertoire-title">
        <div class="section-heading">
          <div>
            <span class="eyebrow">BRANI ASSEGNATI</span>
            <h2 id="repertoire-title">Da preparare</h2>
          </div>
          <p>Lo stato si aggiorna automaticamente mentre provi.</p>
        </div>
        <div id="assignment-list" class="assignment-list"></div>
      </section>
    </main>
  </body>
</html>
