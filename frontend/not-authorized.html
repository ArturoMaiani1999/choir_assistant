<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Accesso non autorizzato · Choir Assistant</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f4f0e8; color: #25211d; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(92vw, 30rem); padding: 2rem; background: #fff; border: 1px solid #d8d0c4; border-radius: 1rem; }
      h1 { margin-top: 0; font-family: Georgia, serif; }
      p { line-height: 1.55; }
      button { border: 0; border-radius: .55rem; padding: .75rem 1rem; background: #59412d; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body data-auth-reason="not-authorized">
    <main>
      <h1>Accesso non autorizzato</h1>
      <p id="auth-status" role="status">Questo indirizzo non è presente nella lista dei coristi autorizzati.</p>
      <div id="clerk-sign-in"></div>
      <div id="signed-in-actions" hidden></div>
      <noscript>Per uscire è necessario JavaScript.</noscript>
    </main>
    <script type="module" src="/auth-client.js"></script>
  </body>
</html>
