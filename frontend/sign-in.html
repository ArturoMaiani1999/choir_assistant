<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Accesso · Epistrophe</title>
    <link rel="stylesheet" href="auth.css">
  </head>
  <body>
    <main>
      <h1>Accedi a Epistrophe</h1>
      <p>Usa l’indirizzo email registrato nella lista dei coristi autorizzati.</p>
      <p><strong>Primo accesso?</strong> Seleziona <strong>Registrati</strong>, inserisci la stessa email e conferma il codice ricevuto.</p>
      <p id="auth-status" role="status">Caricamento accesso…</p>
      <div id="clerk-sign-in"></div>
      <div id="signed-in-actions" hidden></div>
      <noscript>Per effettuare l’accesso è necessario JavaScript.</noscript>
    </main>
    <script type="module" src="/auth-client.js"></script>
  </body>
</html>
