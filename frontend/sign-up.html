<!doctype html>
<html lang="it">
  <head>
    <link rel="stylesheet" href="startup.css">
    <script src="startup.js" data-startup="auth"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Primo accesso · Xynon</title>
    <link rel="stylesheet" href="auth.css">
  </head>
  <body data-auth-mode="sign-up">
    <main>
      <h1>Primo accesso a Xynon</h1>
      <p>Registrati con l’indirizzo email comunicato al responsabile del coro.</p>
      <p>Riceverai un codice via email per confermare il tuo account.</p>
      <p id="auth-status" role="status">Caricamento registrazione…</p>
      <div id="clerk-sign-in"></div>
      <div id="signed-in-actions" hidden></div>
      <noscript>Per effettuare la registrazione è necessario JavaScript.</noscript>
    </main>
    <script type="module" src="/auth-client.js"></script>
  </body>
</html>
